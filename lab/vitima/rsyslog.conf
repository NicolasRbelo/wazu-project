# Sem journald no container: o rsyslog recebe o syslog do sshd e grava no formato tradicional,
# que o predecoder do Wazuh entende ("Oct 30 14:31:05 vitima-lab sshd[123]: ...").
module(load="imuxsock" SysSock.Use="on")
module(load="builtin:omfile" Template="RSYSLOG_TraditionalFileFormat")

authpriv.*                                 /var/log/secure
*.info;authpriv.none;mail.none;cron.none   /var/log/messages
